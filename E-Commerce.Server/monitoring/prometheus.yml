global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8080']
    metrics_path: /metrics

  - job_name: 'security-api'
    static_configs:
      - targets: ['security-api:8080']
    metrics_path: /metrics

  - job_name: 'profile-api'
    static_configs:
      - targets: ['profile-api:8080']
    metrics_path: /metrics

  - job_name: 'ai-api'
    static_configs:
      - targets: ['ai-api:8080']
    metrics_path: /metrics
